services:
  - type: web
    name: entropiq-supervisor
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: ALPACA_FEED
        value: iex
      - key: ALPACA_FORCE_EQUITIES
        value: "1"
      - key: MAX_LATENCY_MS
        value: 1500
      # Configure ALPACA_ACCESS_TOKEN or ALPACA_API_KEY / ALPACA_API_SECRET in Render Dashboard Environment Secrets
